name: Generate Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Create branch if missing
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.METRICS_TOKEN }}" \
            https://api.github.com/repos/BrunoVini/BrunoVini/git/ref/heads/stats-output \
          | grep -q 200 || \
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.METRICS_TOKEN }}" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/BrunoVini/BrunoVini/git/refs \
            -d "{\"ref\":\"refs/heads/stats-output\",\"sha\":\"$(curl -s -H 'Authorization: token ${{ secrets.METRICS_TOKEN }}' https://api.github.com/repos/BrunoVini/BrunoVini/git/ref/heads/main | jq -r .object.sha)\"}"

      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: BrunoVini
          template: classic
          base: activity, community, repositories, metadata
          output_action: commit
          committer_branch: stats-output
          filename: stats.svg

  languages:
    runs-on: ubuntu-latest
    steps:
      - name: Create branch if missing
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.METRICS_TOKEN }}" \
            https://api.github.com/repos/BrunoVini/BrunoVini/git/ref/heads/languages-output \
          | grep -q 200 || \
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.METRICS_TOKEN }}" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/BrunoVini/BrunoVini/git/refs \
            -d "{\"ref\":\"refs/heads/languages-output\",\"sha\":\"$(curl -s -H 'Authorization: token ${{ secrets.METRICS_TOKEN }}' https://api.github.com/repos/BrunoVini/BrunoVini/git/ref/heads/main | jq -r .object.sha)\"}"

      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: BrunoVini
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_limit: 6
          output_action: commit
          committer_branch: languages-output
          filename: languages.svg
